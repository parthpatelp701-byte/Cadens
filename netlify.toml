# Run Netlify from cadens-react. Deploy a draft until the release gates pass.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
  VITE_ENABLE_PWA = "false"

# Existing static files win over this SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Cache-Control = "no-cache"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-xO5b8xYO8Nk951QmquyZjas6O2QGKB8LCxO5QA9Kv/A=' 'sha256-+02LDmNA2KMx6yQzM5N8GkfTMul2NBwKdEybpsuOmI4=' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://iqnctgdnlyxjngqnzacr.supabase.co wss://iqnctgdnlyxjngqnzacr.supabase.co https://graph.microsoft.com https://login.microsoftonline.com https://nominatim.openstreetmap.org; frame-src https://login.microsoftonline.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
