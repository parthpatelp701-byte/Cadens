<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1220" />
    <meta name="color-scheme" content="dark" />
    <title>Cadens — Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1220;
        --card: #111827;
        --line: rgba(148, 163, 184, 0.18);
        --txt: #f8fafc;
        --dim: #94a3b8;
        --acc: #2563eb;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--txt);
        padding: 24px;
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 360px;
        width: 100%;
        padding: 36px 28px;
        border-radius: 20px;
        background: var(--card);
        border: 1px solid var(--line);
        box-shadow: 0 24px 48px -20px rgba(0, 0, 0, 0.55);
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        border-radius: 16px;
        background: linear-gradient(135deg, #2563eb, #22d3ee);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 800;
        font-size: 1.35rem;
        box-shadow: 0 10px 28px -8px rgba(37, 99, 235, 0.55);
      }
      h1 {
        font-size: 1.25rem;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
        text-wrap: balance;
      }
      p {
        font-size: 0.9rem;
        color: var(--dim);
        line-height: 1.55;
        margin-bottom: 22px;
        text-wrap: pretty;
      }
      button {
        font: inherit;
        font-weight: 700;
        font-size: 0.95rem;
        min-height: 48px;
        padding: 12px 22px;
        width: 100%;
        border: none;
        border-radius: 999px;
        background: var(--acc);
        color: #fff;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }
      button:active {
        transform: scale(0.98);
      }
      @media (prefers-reduced-motion: reduce) {
        button:active { transform: none; }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="offline-title">
      <div class="mark" aria-hidden="true">C</div>
      <h1 id="offline-title">You’re offline</h1>
      <p>
        Cadens needs a connection for this. Check your network and try again —
        anything already open may still be available.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
