name: Cadens CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: cadens-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck and production build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
        run: npm run build
      - name: Run unit and compatibility tests
        run: |
          npm run test:unit
          npm run test:library
          npm run test:preservation

  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SQL files are present
        run: |
          test -f sql/RUN_ORDER.md
          test -f sql/13-rls-hardening.sql
          test -f sql/14-calendar-task-sync.sql
